[package]
name = "video_bot_mod"
version = "2.5.1-modular-rust"
edition = "2021"

[dependencies]
teloxide = { version = "0.13", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = "0.4"
regex = "1.10"
anyhow = "1.0"
thiserror = "1.0"
lazy_static = "1.4"
urlencoding = "2.1"
futures = "0.3"