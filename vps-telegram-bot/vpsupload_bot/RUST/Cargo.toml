[package]
name = "video_bot_mod"
version = "2.5.1-modular-rust"
edition = "2021"

[dependencies]
# 显式关闭 native-tls，换用纯 Rust 的 rustls-tls，并开启 ctrlc_handler 支持终端优雅退出
teloxide = { version = "0.13", default-features = false, features = ["macros", "rustls-tls", "ctrlc_handler"] }
# 显式关闭 native-tls，换用 rustls-tls 支撑 YouTube Resumable API 请求
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = "0.4"
regex = "1.10"
anyhow = "1.0"
thiserror = "1.0"
lazy_static = "1.4"
urlencoding = "2.1"
futures = "0.3"