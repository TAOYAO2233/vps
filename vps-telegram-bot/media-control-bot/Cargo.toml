[package]
name = "media-control-bot"
version = "3.0.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "Enterprise-grade Telegram media control bot: RTMP streaming, YouTube upload, FFmpeg transcoding/merging, and remote file management."
license = "MIT"
repository = "https://github.com/yourname/media-control-bot"
keywords = ["telegram", "bot", "ffmpeg", "youtube", "rtmp"]
categories = ["multimedia", "network-programming"]
rust-version = "1.75"

[[bin]]
name = "media-control-bot"
path = "src/main.rs"

[dependencies]
# ── Async runtime ──────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Telegram Bot ───────────────────────────────────────────────────────────────
teloxide = { version = "0.13", features = ["macros", "throttle"] }

# ── Error handling ─────────────────────────────────────────────────────────────
anyhow = "1"
thiserror = "1"

# ── Logging / tracing ──────────────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# ── Configuration / environment ────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"

# ── File system ────────────────────────────────────────────────────────────────
walkdir = "2"

# ── Regex ──────────────────────────────────────────────────────────────────────
regex = "1"
once_cell = "1"

# ── Time ───────────────────────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }

# ── Concurrency utilities ──────────────────────────────────────────────────────
dashmap = "6"
tokio-util = { version = "0.7", features = ["io"] }

# ── YouTube API ────────────────────────────────────────────────────────────────
# google-youtube3 v5 requires yup-oauth2 v9 and hyper v0.14 (not v1)
google-youtube3 = { version = "5", features = ["yup-oauth2"] }
yup-oauth2 = "9"
hyper = { version = "0.14", features = ["full"] }
hyper-rustls = { version = "0.24", features = ["webpki-roots"] }
tokio-stream = "0.1"

# ── Misc ───────────────────────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
bytes = "1"
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
mockall = "0.13"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
# Allow some pedantic lints that are too strict for this project
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
