name: Build Rust Bot Release (Rustls + Musl)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vps-telegram-bot/bilive_bot/RUST

    steps:
    # 1. 拉取仓库代码
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. 【关键修正】安装 musl-tools 补齐 musl-gcc 编译器驱动
    - name: Install musl-tools
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    # 3. 安装 Rust 并注册 musl 目标
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl

    # 4. 缓存 Cargo 依赖
    - name: Cache Dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          vps-telegram-bot/bilive_bot/RUST/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('vps-telegram-bot/bilive_bot/RUST/Cargo.lock') }}

    # 5. 执行静态编译（此时能够顺利找到 musl-gcc 并编译 ring 库）
    - name: Build Binary
      run: cargo build --release --target x86_64-unknown-linux-musl

    # 6. 上传生成的无依赖单文件二进制程序
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bilive_bot_linux_x86_64
        path: vps-telegram-bot/bilive_bot/RUST/target/x86_64-unknown-linux-musl/release/bl_bot_rust