name: Build Rust Bot Release (Rustls)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vps-telegram-bot/bilive_bot/RUST

    steps:
    # 1. 拉取仓库代码
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. 只需要安装 Rust 并注册 musl 目标即可，无需任何额外的 apt 系统依赖安装
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-unknown-linux-musl

    # 3. 缓存 Cargo 依赖（极大加快后续的编译速度）
    - name: Cache Dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          vps-telegram-bot/bilive_bot/RUST/target
        key: ${{ runner.os }}-cargo-${{ hashFiles('vps-telegram-bot/bilive_bot/RUST/Cargo.lock') }}

    # 4. 执行静态编译
    - name: Build Binary
      run: cargo build --release --target x86_64-unknown-linux-musl

    # 5. 上传生成的无依赖单文件二进制程序
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bilive_bot_linux_x86_64
        path: vps-telegram-bot/bilive_bot/RUST/target/x86_64-unknown-linux-musl/release/bl_bot_rust